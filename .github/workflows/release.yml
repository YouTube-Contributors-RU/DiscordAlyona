name: .NET Cross-Platform Build & Publish

# ИИ слопчик

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Канал публикации (Release или Canary)'
        required: true
        default: 'canary'
        type: choice
        options:
          - release
          - canary
          
  schedule:
    - cron: '0 0 * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_changes.outputs.should_run }}
      channel: ${{ steps.set_channel.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверка изменений за последние 24 часа
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Проверяем, были ли коммиты за последние 24 часа
            CHANGES=$(git log --oneline --since="24 hours ago")
            if [ -z "$CHANGES" ]; then
              echo "Изменений не найдено. Сборка отменяется."
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "Найдены изменения. Запуск сборки."
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
          else
            # Для ручного запуска всегда выполняем сборку
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Установка канала сборки (Channel)
        id: set_channel
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "channel=${{ github.event.inputs.channel }}" >> $GITHUB_OUTPUT
          else
            # Автоматические ночные сборки всегда считаем canary (пре-релиз)
            echo "channel=canary" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
            
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 

      - name: Восстановление зависимостей
        run: dotnet restore

      - name: Компиляция (Build)
        run: dotnet build --configuration ${{ matrix.configuration }} --no-restore

      - name: Публикация (Publish)
        run: dotnet publish --configuration ${{ matrix.configuration }} -r ${{ matrix.rid }} --self-contained false -o ./publish_output

      - name: Загрузка артефактов (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ needs.prepare.outputs.channel }}-${{ matrix.rid }}-${{ matrix.configuration }}
          path: ./publish_output
