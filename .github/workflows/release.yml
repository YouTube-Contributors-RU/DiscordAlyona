name: Cross-Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      is_canary:
        description: 'Отметить как Canary / Prerelease?'
        type: boolean
        default: false

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        configuration: [Release, Debug]
        include:
          - os: windows-latest
            platform_name: win-x64
            archive_ext: zip
          - os: ubuntu-latest
            platform_name: linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            platform_name: osx-x64
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Укажите нужную версию .NET SDK

      - name: Publish application
        run: |
          dotnet publish -c ${{ matrix.configuration }} \
            -r ${{ matrix.platform_name }} \
            --self-contained false \
            -o ./publish/${{ matrix.platform_name }}-${{ matrix.configuration }}

      - name: Create Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path ./publish/${{ matrix.platform_name }}-${{ matrix.configuration }}/* `
            -DestinationPath ./app-${{ matrix.platform_name }}-${{ matrix.configuration }}.zip

      - name: Create Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czvf ./app-${{ matrix.platform_name }}-${{ matrix.configuration }}.tar.gz \
            -C ./publish/${{ matrix.platform_name }}-${{ matrix.configuration }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform_name }}-${{ matrix.configuration }}
          path: app-${{ matrix.platform_name }}-${{ matrix.configuration }}.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Determine Prerelease / Canary Flag
        id: check_canary
        run: |
          TAG_NAME="${{ github.ref_name }}"
          IS_CANARY_INPUT="${{ inputs.is_canary }}"
          
          if [[ "$IS_CANARY_INPUT" == "true" ]] || [[ "$TAG_NAME" =~ (canary|beta|alpha|rc|nightly) ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Canary Build ($TAG_NAME)" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Release $TAG_NAME" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          title: ${{ env.RELEASE_TITLE }}
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          files: |
            ./artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
